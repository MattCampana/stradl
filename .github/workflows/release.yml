name: Release

# Push a tag to cut a release:  git tag v1.2.3 && git push origin v1.2.3
# A tag with a pre-release suffix (v1.2.3-rc.1) is published as a pre-release,
# so .../releases/latest/download/ keeps pointing at the last stable build.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Apple Silicon runner: the darwin builds need cgo, and it cross-builds
    # the Intel binary with clang -arch x86_64.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -short ./...

      - name: Build release assets
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" "${{ github.repository }}" dist

      - name: Smoke-test the darwin/arm64 binary
        run: |
          mkdir smoke
          tar -xzf dist/stradl_darwin_arm64.tar.gz -C smoke
          smoke/stradl --version

      - name: Test the installer against the built assets
        run: scripts/test-install.sh dist

      # The attached copy has this repo baked in, so
      # .../releases/latest/download/install.sh works without STRADL_REPO.
      - name: Attach installer
        run: |
          sed "s#REPLACE_OWNER/stradl#${GITHUB_REPOSITORY}#" install.sh >dist/install.sh
          grep -qF "STRADL_REPO:-${GITHUB_REPOSITORY}}" dist/install.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Stradl $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            ${prerelease:+"$prerelease"}
