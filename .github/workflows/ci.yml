name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -short ./...

      - name: Run coverage on library packages
        run: |
          go test -short -coverprofile=coverage.out -covermode=atomic \
            ./internal/claudesettings/ \
            ./internal/config/ \
            ./internal/crypto/ \
            ./internal/paths/ \
            ./internal/storage/ \
            ./internal/sync/ \
            ./internal/util/

      - name: Display coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          THRESHOLD=60
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.out

      # The Linux release binaries are pure Go; make sure that still builds.
      - name: Build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Test installer
        run: scripts/test-install.sh

  macos:
    name: Build & test (macOS, cgo)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -short ./...

      # Same script the release workflow runs, so a broken release build
      # shows up on the PR instead of on the tag.
      - name: Build release assets
        run: scripts/build-release.sh 0.0.0-ci "${{ github.repository }}" dist

      - name: Test installer against the built assets
        run: scripts/test-install.sh dist

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted. Run 'make fmt':"
            echo "$unformatted"
            exit 1
          fi

      - name: shellcheck
        run: shellcheck install.sh scripts/build-release.sh scripts/test-install.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
